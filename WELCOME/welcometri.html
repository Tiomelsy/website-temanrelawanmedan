<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOIN US - TEMAN RELAWAN INDONESIA</title>
    <link rel="stylesheet" href="joinus.css">
</head>

<body>

    <div class="layer-blur"></div>

    <a href="../trimedan.html" class="back-home">← HOME</a>

    <div class="container">

        <div class="heading">
            <h1>JOIN OUR JOURNEY</h1>
            <p>Be part of something meaningful.</p>
        </div>

        <div class="scene">

            <div class="neon-ring"></div>

            <div class="card">

                <!-- LOGIN -->

                <form class="face front" id="loginForm">

                    <img src="../TRI (LOGO).png" class="logo" alt="Logo TRI">

                    <h2>WELCOME</h2>
                    <p class="subtitle">Login to your account</p>

                    <div class="input-box">
                        <input type="email" placeholder="Email Address" required>
                    </div>

                    <div class="input-box">
                        <input type="password" placeholder="Password" required>
                    </div>

                    <div class="options">
                        <label>
                            <input type="checkbox">
                            Remember me
                        </label>

                        <a href="#" class="forgot">Forgot?</a>
                    </div>

                    <button type="submit">LOGIN</button>

                    <p class="switch">
                        Don't have an account?
                        <a href="#" class="show-signup">Sign Up</a>
                    </p>

                </form>


                <!-- SIGN UP -->

                <form class="face back" id="signupForm">

                    <img src="../TRI (LOGO).png" class="logo" alt="Logo TRI">

                    <h2>SIGN UP</h2>
                    <p class="subtitle">Create your account</p>

                    <div class="input-box">
                        <input type="text" placeholder="Full Name" required>
                    </div>

                    <div class="input-box">
                        <input type="email" placeholder="Email Address" required>
                    </div>

                    <div class="input-box">
                        <input type="password" placeholder="Password" required>
                    </div>

                    <button type="submit">CREATE ACCOUNT</button>

                    <p class="switch">
                        Already have an account?
                        <a href="#" class="show-login">Login</a>
                    </p>

                </form>

            </div>

        </div>

        <p class="bottom-text">
            TEMAN RELAWAN INDONESIA MEDAN
        </p>

    </div>


    <script>

        const card = document.querySelector(".card");

        document.querySelector(".show-signup").addEventListener("click", function (e) {
            e.preventDefault();
            card.classList.add("active");
        });

        document.querySelector(".show-login").addEventListener("click", function (e) {
            e.preventDefault();
            card.classList.remove("active");
        });

        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();
            alert("Login belum terhubung dengan sistem TRI Medan.");
        });

        document.getElementById("signupForm").addEventListener("submit", function (e) {
            e.preventDefault();
            alert("Pendaftaran belum terhubung dengan sistem TRI Medan.");
        });

    </script>

</body>

</html>
